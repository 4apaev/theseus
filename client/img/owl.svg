        eye  : #fdd86d;
        fg   : #a4f2be;
        bg   : #895689;
        bg-a : #f0aeca;
     -->
        :root {
            --br : 24;
            --eye: #fdd86d;
            --fg : #d97fcc;
            --bg : #895689;
            --bg-a : #d97fcc;
        }
        .eye  { fill: var(--eye) }
        .fg   { fill: var(--fg) }
        .bg   { fill: var(--bg) }
        .bg-a { fill: var(--bg-a) }
        .br   { fill: none;
                stroke: var(--bg);
                stroke-width: var(--br);
        }
    </style>

