<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name=viewport content="width=device-width, initial-scale=1">
        <meta name=description content="theseus interstellar trade game" />

        <title>⛩ theseus terminal</title>
        <link rel=icon type="image/svg+xml" href="/pub/img/favicon.svg"/> <!-- href="data:," -->
        <link rel=stylesheet href="/pub/css/style.css">
    </head>

    <body>
        <header>
            <span class=brand>⛩ THESEUS<span class=cursor>▮</span></span>
            <span class=dim id=conn>OFFLINE</span>
            <span class=who id=who></span>
            <button hidden  id=logoutBtn>LOGOUT</button>
        </header>

        <main id=auth class=auth>
            <h2>DOCKING CLEARANCE</h2>

            <input required id=handle   type=text     placeholder=handle   autocomplete=username>
            <input required id=password type=password placeholder=password autocomplete="current-password">

            <button id=registerBtn type=button>REGISTER</button>
            <button id=loginBtn    type=button>LOGIN</button>
            <p id=authMsg class=authMsg></p>
        </main>

        <main id=game class=game hidden>
            <section id=walletPanel>
                <h2>WALLET</h2>
                <div id=walletBody></div>
            </section>

            <section id=shipPanel>
                <h2>SHIP</h2>
                <div id=shipBody></div>
            </section>

            <section id=travelPanel>
                <h2>NAV</h2>
                <div id=travelBody></div>
            </section>

            <section id=portPanel>
                <h2>PORT</h2>
                <div id=portBody></div>
            </section>

            <section id=marketPanel>
                <h2>MARKET</h2>
                <div id=marketBody></div>
            </section>

            <section id=cargoPanel>
                <h2>CARGO</h2>
                <div id=cargoBody></div>
            </section>

            <section id=tradesPanel>
                <h2>LEDGER</h2>
                <div id=tradesBody></div>
            </section>

            <section id=logPanel class=logPanel>
                <h2>FEED</h2>
                <div id=feed class=feed></div>
            </section>
        </main>

        <dialog id=nameDialog class=tradeDialog>
            <p id=nameTitle class=money>NAME YOUR SHIP</p>
            <p class=dim>your ship carries this name for every other pilot to see.</p>
            <label>NAME <input id=nameInput type=text maxlength=24 autocomplete=off></label>
            <p id=nameMsg class=authMsg></p>
            <div class=tradeActions>
                <button id=nameCancelBtn  type=button>LATER</button>
                <button id=nameConfirmBtn type=button>CONFIRM</button>
            </div>
        </dialog>

        <dialog id=tradeDialog class=tradeDialog>
            <p id=tradeTitle class=money></p>
            <label>QTY <input id=tradeQty type=number min=1 value=1></label>
            <p>total <span id=tradeTotal class=money></span></p>
            <div class=tradeActions>
                <button id=tradeCancelBtn  type=button>CANCEL</button>
                <button id=tradeConfirmBtn type=button>CONFIRM</button>
            </div>
        </dialog>

        <script type=importmap> { "imports": { "garage/": "/garage/" }}</script>
        <script type=module src="/pub/js/app.js"></script>
    </body>

</html>
